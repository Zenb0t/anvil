<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Herdr Floor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a software factory drawn top to bottom. Intake hopper → agent lanes (machines) → quality control → shipped dock, with a rework line back up the left side. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --sunk: #e3e8ed;
  --ink: #15191e;
  --muted: #5b6672;
  --line: #c4ccd5;
  --accent: #f2b705;
  --accent-ink: #6f5200;
  --on-accent: #1d1600;
  --s-wait: #8e99a5;
  --s-ready: #2f6fd6;
  --s-build: #f2b705;
  --s-block: #d2402f;
  --s-rework: #d9731a;
  --s-review: #6c5bd4;
  --s-done: #3a8a5a;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --surface: #181e25; --sunk: #12171d; --ink: #e7ecf1; --muted: #93a0ad; --line: #34404c;
    --accent: #f5c02a; --accent-ink: #f5c02a; --on-accent: #1d1600;
    --s-wait: #6b7682; --s-ready: #6ca0f2; --s-build: #f5c02a; --s-block: #f06a5a; --s-rework: #f39a4a; --s-review: #9a8cf0; --s-done: #5dbb83;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #181e25; --sunk: #12171d; --ink: #e7ecf1; --muted: #93a0ad; --line: #34404c;
  --accent: #f5c02a; --accent-ink: #f5c02a; --on-accent: #1d1600;
  --s-wait: #6b7682; --s-ready: #6ca0f2; --s-build: #f5c02a; --s-block: #f06a5a; --s-rework: #f39a4a; --s-review: #9a8cf0; --s-done: #5dbb83;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(116px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--s-ready); outline-offset: 2px; }

/* ---------- Header ---------- */
.brand { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand b { font: 700 15px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; }
.brand b span { color: var(--accent-ink); }
.boards { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.boards button { border: none; background: var(--surface); padding: 6px 10px; font: 600 12px/1 var(--font-body); color: var(--muted); min-height: 32px; }
.boards button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.eyebrow { margin: 0; font: 500 12px/1.2 var(--font-mono); color: var(--muted); }
h1 { margin: 0; font: 700 32px/1 var(--font-display); text-wrap: balance; }
h1 .mono { font-size: 19px; color: var(--muted); vertical-align: 4px; margin-right: 6px; }
.epic { display: grid; gap: 8px; }
.progress { display: flex; height: 8px; border-radius: 3px; overflow: hidden; background: var(--sunk); gap: 2px; }
.progress i { display: block; height: 100%; transition: flex-grow .5s; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.stats dt { font: 600 10.5px/1.2 var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stats dd { margin: 2px 0 0; font: 700 20px/1 var(--font-mono); }

/* ---------- Alerts ---------- */
.alerts { display: grid; gap: 8px; }
.alert { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 12px 12px; position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.alert::before { content: ""; position: absolute; inset: 0 0 auto; height: 5px; background: repeating-linear-gradient(-45deg, var(--s-block) 0 7px, transparent 7px 14px); }
.alert p { margin: 0; min-width: 0; font-size: 13.5px; }
.alert .ask { grid-column: 1 / -1; font: 500 12px/1.4 var(--font-mono); background: var(--sunk); padding: 7px 8px; border-radius: 6px; overflow-wrap: anywhere; }
.alert.done::before { background: var(--s-done); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 13px; min-height: 40px; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- Tabs ---------- */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding-block: 6px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 42px; font: 700 16px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hint { margin: 0; color: var(--muted); font-size: 13px; }

/* ---------- Factory SVG ---------- */
.floor { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.floor svg { display: block; width: 100%; height: auto; max-width: 560px; margin: 0 auto; overflow: visible; }
.station-t { font: 700 15px var(--font-display); letter-spacing: .12em; fill: var(--ink); }
.sub { font: 500 10.5px var(--font-mono); fill: var(--muted); }
.belt { fill: var(--surface); stroke: var(--line); }
.run { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 7; animation: run .9s linear infinite; opacity: .7; }
.run.rework { stroke: var(--s-rework); opacity: .9; }
@keyframes run { to { stroke-dashoffset: -12; } }
svg.paused .run, svg.paused .light.l-working, svg.paused .plan-dot { animation-play-state: paused; }
.machine { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.machine.blocked { stroke: var(--s-block); stroke-width: 2; }
.machine.idle, .machine.restarting { stroke-dasharray: 5 4; }
.station { fill: var(--surface); stroke: var(--s-review); stroke-width: 1.5; }
.dock { fill: var(--surface); stroke: var(--s-done); stroke-width: 1.5; }
.slot { fill: none; stroke: var(--line); stroke-dasharray: 3 3; }
.badge { fill: var(--ink); }
.badge-t { fill: var(--bg); font: 700 9.5px var(--font-mono); }
.agent { fill: var(--ink); font: 600 13px var(--font-body); }
.lstatus { font: 600 11px var(--font-body); fill: var(--muted); }
.lstatus.blocked { fill: var(--s-block); }
.light { fill: var(--s-wait); }
.light.l-working, .light.l-planning { fill: var(--s-build); animation: blink 1s ease-in-out infinite alternate; }
.light.l-blocked { fill: var(--s-block); }
@keyframes blink { from { opacity: 1; } to { opacity: .35; } }
.ttl { fill: var(--ink); font: 600 12px var(--font-body); }
.msg { fill: var(--muted); font: 500 10.5px var(--font-mono); }
.msg.ask { fill: var(--s-block); }
.idle-t { fill: var(--muted); font: 500 12px var(--font-body); }
.pip { fill: none; stroke: var(--line); stroke-width: 1; }
.pip.done { fill: var(--s-build); stroke: var(--s-build); }
.pip-fill { fill: var(--s-build); opacity: .55; }
.pip.current { stroke: var(--s-build); stroke-width: 1.5; }
.plan-dot { fill: var(--s-build); animation: blink .6s ease-in-out infinite alternate; }
.bar-bg { fill: var(--sunk); }
.bar { fill: var(--s-review); }
.verdict { font: 600 11px var(--font-body); }
.verdict.pass { fill: var(--s-done); }
.verdict.fail { fill: var(--s-rework); }
.hit { fill: transparent; cursor: pointer; }
.dispatch { fill: var(--surface); stroke: var(--s-ready); stroke-width: 1.5; }
.gate { stroke-width: 1; }
.gate.g-ok { fill: color-mix(in srgb, var(--s-done) 16%, var(--surface)); stroke: var(--s-done); }
.gate.g-no { fill: color-mix(in srgb, var(--s-block) 16%, var(--surface)); stroke: var(--s-block); }
.gate.g-na { fill: var(--surface); stroke: var(--line); stroke-dasharray: 3 2; }
.gate-dot.g-ok { fill: var(--s-done); } .gate-dot.g-no { fill: var(--s-block); } .gate-dot.g-na { fill: var(--s-wait); }
.gate-t { font: 600 8.5px var(--font-body); fill: var(--ink); }
.use { fill: var(--s-ready); } .use.over { fill: var(--s-block); }
.reserve-line { stroke: var(--ink); stroke-width: 1.5; }
.dispatch-status { font: 600 11.5px var(--font-body); fill: var(--ink); }
.dispatch-status.held { fill: var(--s-rework); }
.ctx-t { font: 500 9.5px var(--font-mono); fill: var(--muted); }
.ctx { fill: var(--s-ready); } .ctx.hot { fill: var(--s-rework); }
.light.l-restarting { fill: var(--s-ready); }
.rules .rule { display: grid; grid-template-columns: 1fr auto 3.2em auto; gap: 8px; align-items: center; font-size: 13.5px; }
.rules .rule b { text-align: center; }
.btn.step { min-width: 40px; padding: 6px 0; font-size: 16px; }

.crate { cursor: pointer; }
.floor svg.anim .crate { transition: transform .75s cubic-bezier(.3, .7, .25, 1), opacity .4s; }
.crate rect { stroke-width: 1.6; }
.crate text { font: 700 11px var(--font-mono); fill: var(--ink); }
.c-locked rect { fill: var(--surface); stroke: var(--s-wait); }
.c-ready rect { fill: color-mix(in srgb, var(--s-ready) 18%, var(--surface)); stroke: var(--s-ready); }
.c-planning rect { fill: var(--surface); stroke: var(--s-build); stroke-dasharray: 3 2; }
.c-building rect { fill: var(--s-build); stroke: var(--s-build); }
.c-building text { fill: var(--on-accent); }
.c-needs-you rect { fill: color-mix(in srgb, var(--s-block) 22%, var(--surface)); stroke: var(--s-block); }
.c-rework rect { fill: color-mix(in srgb, var(--s-rework) 22%, var(--surface)); stroke: var(--s-rework); }
.c-qc-queue rect { fill: var(--surface); stroke: var(--s-review); }
.c-qc rect { fill: color-mix(in srgb, var(--s-review) 28%, var(--surface)); stroke: var(--s-review); }
.c-shipped rect { fill: color-mix(in srgb, var(--s-done) 18%, var(--surface)); stroke: color-mix(in srgb, var(--s-done) 60%, var(--surface)); }
.c-shipped text { fill: var(--muted); }

/* ---------- Flow log ---------- */
.log { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.log h2, .sheet h3 { margin: 0; font: 700 13px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.log li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; }
.log li .mono { color: var(--muted); font-size: 12px; }

/* ---------- Map ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; background: var(--c); }
.map-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 4px; }
.map-box svg { display: block; width: 100%; max-width: 520px; height: auto; margin: 0 auto; }
.e { fill: none; stroke-width: 1.6; }
.e-done { stroke: var(--line); }
.e-pend { stroke: var(--s-wait); stroke-dasharray: 4 4; }
.e-crit { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; opacity: .85; }
.n { cursor: pointer; }
.n text { fill: var(--ink); }
.n .id { font: 700 12px var(--font-mono); }
.n .t2 { font: 500 11px var(--font-body); }

/* ---------- Chips & tokens ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px 3px 7px; font: 600 12px/1.2 var(--font-body); white-space: nowrap; background: color-mix(in srgb, var(--c) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; }
.tok { border: 1.5px solid var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); border-radius: 6px; padding: 5px 8px; font: 700 12px/1.1 var(--font-mono); min-height: 32px; display: inline-flex; align-items: center; gap: 6px; }
.tok em { font: 500 11.5px var(--font-body); font-style: normal; color: var(--muted); }
.empty { font-size: 13px; color: var(--muted); margin: 0; }

/* ---------- Controls ---------- */
.controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.controls-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: auto auto 1fr auto; gap: 6px 10px; align-items: center; }
.ticker { grid-column: 1 / -1; margin: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.4em; }
.ticker b { color: var(--ink); }
.play { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.play svg { width: 16px; height: 16px; fill: currentColor; }
.speed { min-width: 52px; }
.clock { justify-self: end; font: 700 17px/1 var(--font-mono); }
.add { justify-self: start; }

/* ---------- Sheet ---------- */
.backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 16px 16px 0 0; max-height: 82%; overflow-y: auto; max-width: 640px; margin: 0 auto;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; box-shadow: 0 -8px 30px rgb(0 0 0 / .25); }
.grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 0; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sheet h2 { margin: 2px 0 6px; font: 700 26px/1.05 var(--font-display); text-wrap: balance; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; margin: 0; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.plan { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.plan li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font: 500 12.5px/1.4 var(--font-mono); overflow-wrap: anywhere; }
.plan li.todo { color: var(--muted); }
.plan li.now { font-weight: 700; }
.plan .mk { text-align: center; }
.sheet .ask { margin: 0; font: 500 12.5px/1.4 var(--font-mono); background: color-mix(in srgb, var(--s-block) 12%, var(--surface)); padding: 8px; border-radius: 6px; overflow-wrap: anywhere; }
.source { font-size: 12px; color: var(--muted); margin: 0; border-top: 1px solid var(--line); padding-top: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  .run, .light, .plan-dot { animation: none !important; }
  .floor svg.anim .crate { transition: none; }
}
</style>

<div class="wrap">
  <div class="brand"><b>Herdr <span>Floor</span></b><div class="boards" id="boards"></div></div>
  <section class="epic" id="epic"></section>
  <section class="alerts" id="alerts" aria-live="polite"></section>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<div class="controls">
  <div class="controls-in">
    <p class="ticker" id="ticker" aria-live="polite"></p>
    <button class="play" id="play" type="button" aria-label="Pause"></button>
    <button class="btn speed" id="speed" type="button">1×</button>
    <button class="btn add" id="add" type="button">+ Lane</button>
    <span class="clock" id="clock">09:00</span>
  </div>
</div>
<div id="sheet-root"></div>

<script>
/* =====================================================================
   DOMAIN: pure data and functions. No DOM, no timers, no I/O.
   A real build feeds `tick` with events from two adapters: a tracker
   adapter (GitHub, Notion, Linear: anything with a board you can read
   and write) and the herdr socket (pane.agent_state_changed). Here the
   factory is simulated with a seeded random generator so it replays
   identically.
   ===================================================================== */

const EPIC = { id: 412, title: "Offline-first sync" };
const MINUTES_PER_TICK = 2;
const AUTO_ANSWER_TICKS = 14;  // simulated human answers a blocked agent after this long
const MAX_LANES = 6;
const AGENT_POOL = ["claude", "codex", "pi", "amp", "opencode", "claude"];
const ASKS = [
  "Allow: pnpm add @react-native-community/netinfo",
  "Cursor or offset pagination for /sync/delta?",
  "Allow edit: migrations/0007_sync.sql",
  "Run the full test suite? (about 2 minutes)",
];

const TICKETS = [
  { id: 413, short: "Sync schema", area: "sync-core",     title: "Define sync schema and conflict policy", deps: [],
    plan: ["docs(sync): conflict policy ADR", "feat(db): add sync_version columns", "feat(sync): shared change types"] },
  { id: 417, short: "Token refresh", area: "auth",   title: "Refresh auth tokens in the background", deps: [],
    plan: ["feat(auth): refresh scheduler", "feat(auth): retry once on 401", "test(auth): refresh race"] },
  { id: 414, short: "SQLite store", area: "store",    title: "Local SQLite store layer", deps: [413],
    plan: ["feat(store): sqlite adapter", "feat(store): notes repository", "feat(store): migration runner", "test(store): crud round trip"] },
  { id: 416, short: "Delta sync API", area: "api",  title: "Server endpoint for delta sync", deps: [413],
    plan: ["feat(api): GET /sync/delta with cursor", "feat(api): POST /sync/push", "test(api): delta pagination"] },
  { id: 415, short: "Change journal", area: "store",  title: "Change journal (outbox) for local writes", deps: [414],
    plan: ["feat(outbox): journal table", "feat(outbox): record writes in tx", "test(outbox): ordering"] },
  { id: 419, short: "Delta pull", area: "sync-core",      title: "Client delta pull from the server", deps: [414, 416],
    plan: ["feat(pull): fetch delta pages", "feat(pull): apply to store", "feat(pull): persist cursor", "test(pull): resume after kill"] },
  { id: 418, short: "Outbox uploader", area: "outbox", title: "Upload the outbox with retry and backoff", deps: [415, 416, 417],
    plan: ["feat(outbox): batch uploader", "feat(outbox): retry with backoff", "feat(outbox): wire into SyncService", "test(outbox): offline then online"] },
  { id: 426, short: "Network monitor", area: "net", title: "Detect online and offline transitions", deps: [],
    plan: ["feat(net): NetworkMonitor service", "feat(net): debounce flapping", "test(net): transitions"] },
  { id: 427, short: "Sync settings", area: "settings",   title: "Sync settings screen", deps: [],
    plan: ["feat(settings): sync section", "feat(settings): wifi-only toggle", "test(settings): persisted prefs"] },
  { id: 421, short: "Sync indicator", area: "ui",  title: "Sync status indicator in the app bar", deps: [415, 426],
    plan: ["feat(ui): useSyncStatus hook", "feat(ui): app bar badge", "test(ui): indicator states"] },
  { id: 420, short: "Conflict merge", area: "sync-core",  title: "Merge conflicting edits on pull", deps: [418, 419],
    plan: ["feat(sync): field-level merge", "feat(sync): conflict log", "test(sync): concurrent edits"] },
  { id: 422, short: "BG scheduling", area: "platform",   title: "Schedule sync in the background", deps: [418],
    plan: ["feat(ios): BGTaskScheduler job", "feat(android): WorkManager job", "test(bg): schedule contract"] },
  { id: 424, short: "Sync telemetry", area: "telemetry",  title: "Report sync failures to telemetry", deps: [418],
    plan: ["feat(telemetry): sync_failed event", "feat(telemetry): sampling"] },
  { id: 423, short: "E2E offline", area: "e2e",     title: "End-to-end offline test suite", deps: [420, 422],
    plan: ["test(e2e): airplane mode flow", "test(e2e): conflict flow", "ci: run e2e on PRs"] },
  { id: 425, short: "Rollout & docs", area: "flags",  title: "Feature flag rollout and docs", deps: [423, 421, 427],
    plan: ["feat(flags): offline_sync flag", "docs: offline sync guide"] },
];
const TICKET = Object.fromEntries(TICKETS.map(t => [t.id, t]));
const DEPENDENTS = Object.fromEntries(TICKETS.map(t => [t.id, TICKETS.filter(o => o.deps.includes(t.id)).map(o => o.id)]));

/** Deterministic random numbers: returns [value in 0..1, next seed]. */
function random(seed) {
  let t = (seed + 0x6d2b79f5) | 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return [((t ^ (t >>> 14)) >>> 0) / 4294967296, (seed + 0x6d2b79f5) | 0];
}

const createLane = (id, agent) => ({ id, agent, ticket: null, status: "idle", ask: null, since: 0, planLeft: 0, progress: 0, context: 6, restartLeft: 0 });
const USAGE_WINDOW_TICKS = 150; // a 5-hour usage window at 2 minutes per tick

function initialState(seed) {
  return {
    t: 0, seed, nextWorkspace: 3, nextPr: 501,
    tickets: Object.fromEntries(TICKETS.map(t => [t.id, {
      stage: "intake", lane: null, pr: null, qcRounds: 0, commits: t.plan.map(msg => ({ msg, done: false })),
    }])),
    lanes: [createLane("1-1", "claude"), createLane("1-2", "codex"), createLane("2-1", "pi")],
    qc: { ticket: null, progress: 0, last: null },
    qcQueue: [], shipped: [], log: [],
    limits: { qcMax: 2, reserve: 20, contextRestart: 70 },
    usage: { used: 22, resetsAt: 120 },
    dispatch: { lastHold: null },
  };
}

const isReady = (s, id) => s.tickets[id].stage === "intake" && TICKET[id].deps.every(d => s.tickets[d].stage === "shipped");
const readyTickets = s => TICKETS.map(t => t.id).filter(id => isReady(s, id));
const currentCommit = ticket => ticket.commits.findIndex(c => !c.done);
const laneExists = (s, id) => s.lanes.some(l => l.id === id);

/**
 * One step of the factory. Works on a private copy and returns it,
 * so callers never see their state change.
 */
function tick(previous) {
  const s = structuredClone(previous);
  s.t += 1;
  const rand = () => { const [v, next] = random(s.seed); s.seed = next; return v; };
  const log = (ticket, text) => { s.log.unshift({ t: s.t, ticket, text }); s.log.length = Math.min(s.log.length, 40); };

  stepUsage(s, log);
  stepQualityControl(s, rand, log);
  stepDispatcher(s, log);
  s.lanes.forEach(lane => stepLane(s, lane, rand, log));
  return s;
}

function stepUsage(s, log) {
  if (s.t >= s.usage.resetsAt) {
    s.usage = { used: 0, resetsAt: s.usage.resetsAt + USAGE_WINDOW_TICKS };
    log(null, "usage window reset");
  }
  const busy = s.lanes.filter(l => l.status === "working" || l.status === "planning").length;
  s.usage.used = Math.min(100, s.usage.used + 0.3 * busy + (s.qc.ticket ? 0.12 : 0));
}

const ACTIVE_STAGES = ["planning", "building", "rework"];

/**
 * The dispatcher's decision for one free lane: every gate, and the ticket
 * it would hand over if all gates are green. Pure, so the view shows the
 * exact reasoning the dispatcher used.
 */
function dispatchDecision(s, lane) {
  const ready = readyTickets(s);
  const areasInUse = new Set(TICKETS.filter(t => ACTIVE_STAGES.includes(s.tickets[t.id].stage)).map(t => t.area));
  const clear = ready.filter(id => !areasInUse.has(TICKET[id].area));
  const ceiling = 100 - s.limits.reserve;
  const gates = [
    { id: "lane",    label: "Lane",    ok: !!lane,                              detail: lane ? `${lane.id} is free` : "every lane is busy" },
    { id: "ready",   label: "Ready",   ok: ready.length > 0,                    detail: ready.length ? `${ready.length} ready` : "nothing ready yet" },
    { id: "overlap", label: "Overlap", ok: ready.length ? clear.length > 0 : null, detail: !ready.length ? "nothing to check" : clear.length ? "no shared area" : `${TICKET[ready[0]].area} is in use` },
    { id: "qc",      label: "QC",      ok: s.qcQueue.length < s.limits.qcMax,   detail: `QC queue ${s.qcQueue.length} of ${s.limits.qcMax}` },
    { id: "usage",   label: "Usage",   ok: s.usage.used < ceiling,              detail: `usage ${Math.round(s.usage.used)}%, stop at ${ceiling}%` },
    { id: "ctx",     label: "Ctx", ok: lane ? lane.context < s.limits.contextRestart : null, detail: lane ? `context ${Math.round(lane.context)}%, restart at ${s.limits.contextRestart}%` : "no free lane" },
  ];
  const pick = gates.every(g => g.ok !== false) && clear.length ? clear[0] : null;
  const blocker = gates.find(g => g.ok === false);
  return { gates, pick, held: ready.filter(id => id !== pick), blocker };
}

const freeLane = s => s.lanes.find(l => l.status === "idle");

function stepDispatcher(s, log) {
  for (const lane of s.lanes.filter(l => l.status === "idle")) {
    const rework = TICKETS.map(t => t.id).find(id => s.tickets[id].stage === "rework" && (s.tickets[id].lane === lane.id || !laneExists(s, s.tickets[id].lane)));
    if (rework) {
      Object.assign(s.tickets[rework], { stage: "building", lane: lane.id });
      Object.assign(lane, { ticket: rework, status: "working", since: s.t, progress: 0 });
      log(rework, `dispatched back to lane ${lane.id} for rework`);
      continue;
    }
    if (lane.context >= s.limits.contextRestart) {
      Object.assign(lane, { status: "restarting", restartLeft: 2, since: s.t });
      log(null, `lane ${lane.id} restarting with a fresh session (context ${Math.round(lane.context)}%)`);
      continue;
    }
    const decision = dispatchDecision(s, lane);
    if (decision.pick) {
      Object.assign(s.tickets[decision.pick], { stage: "planning", lane: lane.id });
      Object.assign(lane, { ticket: decision.pick, status: "planning", planLeft: 2, since: s.t, progress: 0 });
      s.dispatch.lastHold = null;
      log(decision.pick, `dispatched to ${lane.agent} ${lane.id}, all gates green`);
    } else if (decision.blocker && decision.held.length) {
      const hold = `held: ${decision.blocker.detail}`;
      if (s.dispatch.lastHold !== hold) log(null, `dispatcher ${hold}`);
      s.dispatch.lastHold = hold;
    }
  }
}

function stepQualityControl(s, rand, log) {
  const qc = s.qc;
  if (qc.ticket) {
    qc.progress += 0.2 + rand() * 0.12;
    if (qc.progress >= 1) {
      const ticket = s.tickets[qc.ticket];
      const pass = ticket.qcRounds > 0 || rand() < 0.7;
      ticket.qcRounds += 1;
      ticket.firstVerdict ??= pass;
      if (pass) {
        ticket.stage = "shipped";
        s.shipped.push(qc.ticket);
        log(qc.ticket, `passed QC, merged and shipped`);
      } else {
        ticket.stage = "rework";
        ticket.commits.push({ msg: `fix: address review on PR #${ticket.pr}`, done: false });
        log(qc.ticket, `rejected by QC, sent back to lane ${ticket.lane}`);
      }
      qc.last = { ticket: qc.ticket, pass, lane: ticket.lane };
      qc.ticket = null;
      qc.progress = 0;
    }
  }
  if (!qc.ticket && s.qcQueue.length) {
    qc.ticket = s.qcQueue.shift();
    s.tickets[qc.ticket].stage = "qc";
    log(qc.ticket, `entered QC (pr-reviewer)`);
  }
}

function stepLane(s, lane, rand, log) {
  const ticket = lane.ticket && s.tickets[lane.ticket];
  switch (lane.status) {
    case "blocked":
      if (s.t - lane.since >= AUTO_ANSWER_TICKS) {
        Object.assign(lane, { status: "working", ask: null, since: s.t });
        log(lane.ticket, `answered, ${lane.agent} ${lane.id} resumed`);
      }
      return;
    case "idle":
      return;
    case "restarting":
      lane.restartLeft -= 1;
      if (lane.restartLeft <= 0) Object.assign(lane, { status: "idle", context: 6, since: s.t });
      return;
    case "planning":
      lane.context = Math.min(100, lane.context + 3);
      lane.planLeft -= 1;
      if (lane.planLeft <= 0) {
        ticket.stage = "building";
        Object.assign(lane, { status: "working", since: s.t });
        log(lane.ticket, `plan written to ticket: ${ticket.commits.length} commits`);
      }
      return;
    case "working": {
      if (rand() < 0.035) {
        Object.assign(lane, { status: "blocked", ask: ASKS[Math.floor(rand() * ASKS.length)], since: s.t });
        log(lane.ticket, `${lane.agent} ${lane.id} needs you`);
        return;
      }
      lane.context = Math.min(100, lane.context + 1.5 + rand() * 1.5);
      lane.progress += 0.3 + rand() * 0.25;
      if (lane.progress < 1) return;
      const index = currentCommit(ticket);
      ticket.commits[index].done = true;
      lane.progress = 0;
      log(lane.ticket, `committed ${ticket.commits[index].msg}`);
      if (currentCommit(ticket) === -1) {
        ticket.pr ??= s.nextPr++;
        ticket.stage = "qc-queue";
        s.qcQueue.push(lane.ticket);
        log(lane.ticket, `PR #${ticket.pr} sent to QC`);
        Object.assign(lane, { ticket: null, status: "idle", since: s.t });
      }
      return;
    }
  }
}

const runTicks = (s, n) => Array.from({ length: n }).reduce(tick, s);

/* User actions: also pure. */
const LIMIT_RANGES = { qcMax: [1, 5, 1], reserve: [0, 50, 10], contextRestart: [40, 90, 10] };
function changeLimit(previous, key, direction) {
  const [min, max, step] = LIMIT_RANGES[key];
  const value = Math.max(min, Math.min(max, previous.limits[key] + direction * step));
  if (value === previous.limits[key]) return previous;
  return { ...previous, limits: { ...previous.limits, [key]: value } };
}
function approve(previous, laneId) {
  const s = structuredClone(previous);
  const lane = s.lanes.find(l => l.id === laneId);
  if (!lane || lane.status !== "blocked") return previous;
  Object.assign(lane, { status: "working", ask: null, since: s.t });
  s.log.unshift({ t: s.t, ticket: lane.ticket, text: `you approved, ${lane.agent} ${lane.id} resumed` });
  return s;
}
function openLane(previous) {
  if (previous.lanes.length >= MAX_LANES) return previous;
  const s = structuredClone(previous);
  const lane = createLane(`${s.nextWorkspace}-1`, AGENT_POOL[s.nextWorkspace % AGENT_POOL.length]);
  lane.since = s.t;
  s.nextWorkspace += 1;
  s.lanes.push(lane);
  s.log.unshift({ t: s.t, ticket: null, text: `opened lane ${lane.id} with ${lane.agent}` });
  return s;
}
function closeLane(previous, laneId) {
  const lane = previous.lanes.find(l => l.id === laneId);
  if (!lane || lane.status !== "idle") return previous;
  const s = structuredClone(previous);
  s.lanes = s.lanes.filter(l => l.id !== laneId);
  s.log.unshift({ t: s.t, ticket: null, text: `closed lane ${laneId}` });
  return s;
}

/** The one status a person reads for a ticket, combining board stage and agent state. */
function ticketStatus(s, id) {
  const tk = s.tickets[id];
  if (tk.stage === "intake") return isReady(s, id) ? "ready" : "locked";
  if (tk.stage === "building") {
    const lane = s.lanes.find(l => l.ticket === id);
    return lane?.status === "blocked" ? "needs-you" : "building";
  }
  return tk.stage;
}

const STATUS = {
  "locked":    { label: "Locked by deps", color: "--s-wait", board: "Backlog" },
  "ready":     { label: "Ready",          color: "--s-ready", board: "Ready" },
  "planning":  { label: "Planning",       color: "--s-build", board: "In progress" },
  "building":  { label: "Building",       color: "--s-build", board: "In progress" },
  "needs-you": { label: "Needs you",      color: "--s-block", board: "In progress" },
  "rework":    { label: "Rework",         color: "--s-rework", board: "Changes requested" },
  "qc-queue":  { label: "Waiting for QC", color: "--s-review", board: "In review" },
  "qc":        { label: "In QC",          color: "--s-review", board: "In review" },
  "shipped":   { label: "Shipped",        color: "--s-done", board: "Done" },
};

function flowStats(s) {
  const decided = TICKETS.filter(t => s.tickets[t.id].firstVerdict !== undefined);
  const firstPass = decided.filter(t => s.tickets[t.id].firstVerdict).length;
  return {
    busy: s.lanes.filter(l => l.ticket).length,
    lanes: s.lanes.length,
    qcWaiting: s.qcQueue.length,
    shipped: s.shipped.length,
    firstPassRate: decided.length ? Math.round((firstPass / decided.length) * 100) : null,
  };
}

/** Map helpers: rows by dependency depth, and the longest chain of unshipped tickets. */
function depthOf(id, memo = {}) {
  if (memo[id] !== undefined) return memo[id];
  const deps = TICKET[id].deps;
  return (memo[id] = deps.length ? 1 + Math.max(...deps.map(d => depthOf(d, memo))) : 0);
}
function criticalPath(s) {
  const open = id => s.tickets[id].stage !== "shipped";
  const mu = {}, md = {};
  const up = id => mu[id] ??= open(id) ? 1 + Math.max(0, ...TICKET[id].deps.filter(open).map(up)) : 0;
  const down = id => md[id] ??= open(id) ? 1 + Math.max(0, ...DEPENDENTS[id].filter(open).map(down)) : 0;
  const length = Math.max(0, ...TICKETS.map(t => up(t.id) + down(t.id) - 1));
  const nodes = new Set(TICKETS.filter(t => open(t.id) && up(t.id) + down(t.id) - 1 === length).map(t => t.id));
  return { length, nodes, isEdge: (a, b) => nodes.has(a) && nodes.has(b) && up(b) === up(a) + 1 };
}
function layoutMap(width) {
  const memo = {}, rows = [], pos = {};
  TICKETS.forEach(t => (rows[depthOf(t.id, memo)] ??= []).push(t.id));
  const avgX = id => TICKET[id].deps.reduce((n, d) => n + pos[d].x, 0) / TICKET[id].deps.length;
  rows.forEach((ids, depth) => {
    const ordered = depth === 0 ? ids : [...ids].sort((a, b) => avgX(a) - avgX(b));
    ordered.forEach((id, i) => { pos[id] = { x: width * (i + 0.5) / ordered.length, y: 32 + depth * 80 }; });
  });
  return { pos, height: 32 + (rows.length - 1) * 80 + 36 };
}

/* Trackers: only naming changes here; the adapter contract is the same. */
const BOARDS = {
  github: { label: "GitHub", source: "GitHub issues", id: n => `#${n}` },
  notion: { label: "Notion", source: "Notion board", id: n => `SYNC-${n}` },
  linear: { label: "Linear", source: "Linear project", id: n => `ENG-${n}` },
};

/* =====================================================================
   FACTORY LAYOUT: pure geometry for the SVG (viewBox width 360).
   ===================================================================== */

const W = 360, CW = 44, CH = 22, LANE_H = 100, LANE_GAP = 8, DISPATCH_Y = 80, DISPATCH_H = 112, LANES_Y = DISPATCH_Y + DISPATCH_H + 14, QC_H = 104;

function factoryLayout(laneCount) {
  const laneY = Array.from({ length: laneCount }, (_, i) => LANES_Y + i * (LANE_H + LANE_GAP));
  const qcY = LANES_Y + laneCount * (LANE_H + LANE_GAP) + 10;
  const shipY = qcY + QC_H + 18;
  const shipRows = Math.ceil(TICKETS.length / 6);
  const shipH = 34 + shipRows * 28;
  return { laneY, qcY, shipY, shipH, height: shipY + shipH + 4 };
}

/** Where each ticket's crate sits on the floor. */
function cratePosition(s, id, L) {
  const status = ticketStatus(s, id);
  const tk = s.tickets[id];
  const laneIndex = s.lanes.findIndex(l => l.id === tk.lane);
  switch (status) {
    case "locked": return { x: W + 12, y: 34, opacity: 0, status };
    case "ready": {
      const i = readyTickets(s).indexOf(id);
      return { x: 10 + Math.min(i, 5) * 50, y: 34, opacity: i < 6 ? 1 : 0, status };
    }
    case "planning": case "building": case "needs-you":
      return { x: 34, y: L.laneY[laneIndex] + 30, opacity: 1, status };
    case "rework":
      return laneIndex >= 0 ? { x: 270, y: L.laneY[laneIndex] + 30, opacity: 1, status } : { x: 2, y: L.qcY + 60, opacity: 1, status };
    case "qc-queue": {
      const i = s.qcQueue.indexOf(id);
      return { x: 34 + Math.min(i, 3) * 46, y: L.qcY + 36, opacity: i < 4 ? 1 : 0, status };
    }
    case "qc": return { x: 246, y: L.qcY + 36, opacity: 1, status };
    case "shipped": {
      const i = s.shipped.indexOf(id);
      return { x: 34 + (i % 6) * 48, y: L.shipY + 32 + Math.floor(i / 6) * 28, opacity: 1, status };
    }
  }
}

/* =====================================================================
   VIEWS: pure functions from state to markup strings.
   ===================================================================== */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const clock = t => { const m = 9 * 60 + t * MINUTES_PER_TICK; return `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const chip = status => `<span class="chip" style="--c:var(${STATUS[status].color})">${STATUS[status].label}</span>`;
const token = (board, s, id) => `<button type="button" class="tok" style="--c:var(${STATUS[ticketStatus(s, id)].color})" data-ticket="${id}">${board.id(id)} <em>${esc(TICKET[id].short)}</em></button>`;

function boardsView(boardKey) {
  return Object.entries(BOARDS).map(([key, b]) => `<button type="button" data-board="${key}" aria-pressed="${key === boardKey}">${b.label}</button>`).join("");
}

function epicView(s, board) {
  const counts = {};
  TICKETS.forEach(t => { const st = ticketStatus(s, t.id); counts[st] = (counts[st] ?? 0) + 1; });
  const order = ["shipped", "qc", "qc-queue", "building", "needs-you", "planning", "rework", "ready", "locked"];
  const bar = order.filter(k => counts[k]).map(k => `<i style="flex:${counts[k]};background:var(${STATUS[k].color})" title="${STATUS[k].label}: ${counts[k]}"></i>`).join("");
  const f = flowStats(s);
  return `<p class="eyebrow">Epic · from ${board.source} · ${TICKETS.length} tickets</p>
    <h1><span class="mono">${board.id(EPIC.id)}</span>${EPIC.title}</h1>
    <div class="progress" role="img" aria-label="${f.shipped} of ${TICKETS.length} shipped">${bar}</div>
    <dl class="stats">
      <div><dt>Lanes busy</dt><dd>${f.busy}/${f.lanes}</dd></div>
      <div><dt>QC queue</dt><dd>${f.qcWaiting}</dd></div>
      <div><dt>First-pass</dt><dd>${f.firstPassRate === null ? "—" : f.firstPassRate + "%"}</dd></div>
      <div><dt>Shipped</dt><dd>${f.shipped}/${TICKETS.length}</dd></div>
    </dl>`;
}

function alertsView(s, board) {
  if (s.shipped.length === TICKETS.length) {
    return `<div class="alert done"><p><b>Epic shipped at ${clock(s.t)}.</b> All ${TICKETS.length} tickets passed QC.</p><button class="btn primary" type="button" data-reset>Run again</button></div>`;
  }
  return s.lanes.filter(l => l.status === "blocked").map(l => `<div class="alert">
    <p><b>${l.agent} ${l.id} needs you</b> on ${board.id(l.ticket)} ${esc(TICKET[l.ticket].short)}</p>
    <button class="btn primary" type="button" data-approve="${l.id}">Approve</button>
    <p class="ask">${esc(l.ask)}</p></div>`).join("");
}

function tabsView(tab) {
  return [["factory", "Factory"], ["map", "Epic map"]].map(([id, label]) =>
    `<button type="button" role="tab" aria-selected="${tab === id}" data-tab="${id}">${label}</button>`).join("");
}

  return `

    <rect class="dispatch" x="24" y="${DISPATCH_Y}" width="300" height="${DISPATCH_H}" rx="10"/>

}

function intakeLabelView(s) {
  const locked = TICKETS.filter(t => ticketStatus(s, t.id) === "locked").length;
  const ready = readyTickets(s).length;
  return `<text class="sub" x="356" y="16" text-anchor="end">${ready} ready · ${locked} locked by deps</text>`;
}

function dispatchView(s, board) {
  const y = DISPATCH_Y;
  const lane = freeLane(s);
  const d = dispatchDecision(s, lane);
  const pills = d.gates.map((g, i) => {
    const x = 34 + i * 47, state = g.ok === null ? "na" : g.ok ? "ok" : "no";
    return `<rect class="gate g-${state}" x="${x}" y="${y + 30}" width="44" height="22" rx="5"/>
      <circle class="gate-dot g-${state}" cx="${x + 8}" cy="${y + 41}" r="3"/>
      <text class="gate-t" x="${x + 14}" y="${y + 44.5}">${g.label}</text>`;
  }).join("");
  const ceiling = 100 - s.limits.reserve;
  const usedW = (280 * s.usage.used / 100).toFixed(1);
  const reserveX = 34 + 280 * ceiling / 100;
  const status = !lane
    ? `All lanes busy. ${d.held.length} ready ticket${d.held.length === 1 ? "" : "s"} waiting.`
    : d.blocker && d.held.length
      ? `Holding ${board.id(d.held[0])}: ${d.blocker.detail}`
      : d.pick ? `Next: ${board.id(d.pick)} to lane ${lane.id}` : "Nothing ready to hand out";
  return `<text class="station-t" x="34" y="${y + 20}">DISPATCH</text>
    <text class="sub" x="314" y="${y + 20}" text-anchor="end">dispatcher · one pool</text>
    ${pills}
    <text class="sub" x="34" y="${y + 68}">usage · 5h window</text>
    <text class="sub" x="314" y="${y + 68}" text-anchor="end">${Math.round(s.usage.used)}% · resets ${clock(s.usage.resetsAt)}</text>
    <rect class="bar-bg" x="34" y="${y + 74}" width="280" height="8" rx="3"/>
    <rect class="reserve" x="${reserveX.toFixed(1)}" y="${y + 74}" width="${(314 - reserveX).toFixed(1)}" height="8" fill="url(#hz-soft)"/>
    <rect class="${s.usage.used >= ceiling ? "use over" : "use"}" x="34" y="${y + 74}" width="${usedW}" height="8" rx="3"/>
    <line class="reserve-line" x1="${reserveX.toFixed(1)}" x2="${reserveX.toFixed(1)}" y1="${y + 71}" y2="${y + 85}"/>
    <text class="dispatch-status ${d.blocker && d.held.length && lane ? "held" : ""}" x="34" y="${y + 102}">${esc(trunc(status, 52))}</text>`;
}

function laneView(s, lane, y, board) {
  const status = lane.status;
  const label = { idle: "idle", planning: "planning", working: "building", blocked: "needs you", restarting: "restarting" }[status];
  const ctx = Math.round(lane.context), ctxHot = ctx >= s.limits.contextRestart;
  const parts = [
    `<rect class="machine ${status}" x="24" y="${y}" width="300" height="${LANE_H}" rx="10"/>`,
    status === "blocked" ? `<rect x="24" y="${y}" width="300" height="5" fill="url(#hz)"/>` : "",
    `<rect class="badge" x="34" y="${y + 8}" width="30" height="15" rx="3"/><text class="badge-t" x="49" y="${y + 19}" text-anchor="middle">${lane.id}</text>`,
    `<text class="agent" x="72" y="${y + 20}">${lane.agent}</text>`,
    `<text class="ctx-t" x="146" y="${y + 19}">ctx</text><rect class="bar-bg" x="166" y="${y + 12}" width="44" height="6" rx="3"/>`,
    `<rect class="${ctxHot ? "ctx hot" : "ctx"}" x="166" y="${y + 12}" width="${(44 * ctx / 100).toFixed(1)}" height="6" rx="3"/><text class="ctx-t" x="214" y="${y + 19}">${ctx}%</text>`,
    `<text class="lstatus ${status}" x="300" y="${y + 20}" text-anchor="end">${label}</text>`,
    `<circle class="light l-${status}" cx="310" cy="${y + 16}" r="4.5"/>`,
    `<rect class="slot" x="32" y="${y + 28}" width="48" height="26" rx="5"/>`,
  ];
  if (status === "restarting") {
    parts.push(`<text class="idle-t" x="92" y="${y + 46}">Starting a fresh session</text>`);
    return parts.join("");
  }
  if (!lane.ticket) {
    parts.push(`<text class="idle-t" x="92" y="${y + 46}">Waiting for the dispatcher</text>`);
    return parts.join("");
  }
  const tk = s.tickets[lane.ticket];
  parts.push(`<text class="ttl" x="88" y="${y + 46}">${esc(trunc(TICKET[lane.ticket].short, 24))}</text>`);
  if (status === "planning") {
    parts.push(`<circle class="plan-dot" cx="38" cy="${y + 72}" r="3"/><text class="msg" x="48" y="${y + 76}">writing the commit plan to the ticket…</text>`);
    return parts.join("");
  }
  const n = tk.commits.length, gap = 4, pw = (280 - (n - 1) * gap) / n;
  const current = currentCommit(tk);
  tk.commits.forEach((c, i) => {
    const x = 34 + i * (pw + gap);
    const cls = c.done ? "done" : i === current ? "current" : "";
    if (i === current) parts.push(`<rect class="pip-fill" x="${x}" y="${y + 64}" width="${(pw * Math.min(lane.progress, 1)).toFixed(1)}" height="8" rx="2"/>`);
    parts.push(`<rect class="pip ${cls}" x="${x}" y="${y + 64}" width="${pw.toFixed(1)}" height="8" rx="2"/>`);
  });
  parts.push(status === "blocked"
    ? `<text class="msg ask" x="34" y="${y + 90}">? ${esc(trunc(lane.ask, 44))}</text>`
    : `<text class="msg" x="34" y="${y + 90}">${current + 1}/${n} ▸ ${esc(trunc(tk.commits[current].msg, 38))}</text>`);
  return parts.join("");
}

function qcView(s, L, board) {
  const y = L.qcY, qc = s.qc;
  const more = s.qcQueue.length > 4 ? `<text class="sub" x="${34 + 3 * 46 + 50}" y="${y + 51}">+${s.qcQueue.length - 4}</text>` : "";
  const slots = [0, 1, 2, 3].map(i => `<rect class="slot" x="${32 + i * 46}" y="${y + 34}" width="48" height="26" rx="5"/>`).join("");
  const last = qc.last
    ? qc.last.pass
      ? `<text class="verdict pass" x="34" y="${y + 92}">✓ ${board.id(qc.last.ticket)} passed, shipped</text>`
      : `<text class="verdict fail" x="34" y="${y + 92}">✕ ${board.id(qc.last.ticket)} rejected, back to lane ${qc.last.lane}</text>`
    : `<text class="sub" x="34" y="${y + 92}">No verdicts yet</text>`;
  return `<text class="station-t" x="34" y="${y + 20}">QUALITY CONTROL</text>
    <text class="sub" x="314" y="${y + 20}" text-anchor="end">pr-reviewer · 9-1</text>
    ${slots}${more}
    <text class="sub" x="34" y="${y + 74}">queue ${s.qcQueue.length}</text>
    <rect class="slot" x="238" y="${y + 30}" width="76" height="34" rx="6"/>
    <rect class="bar-bg" x="238" y="${y + 70}" width="76" height="6" rx="3"/>
    <rect class="bar" x="238" y="${y + 70}" width="${(76 * Math.min(qc.progress, 1)).toFixed(1)}" height="6" rx="3"/>
    ${last}`;
}

function shipLabelView(s, L) {
  return `<text class="sub" x="314" y="${L.shipY + 20}" text-anchor="end">${s.shipped.length} of ${TICKETS.length}</text>`;
}

function rulesView(s) {
  const rule = (key, label, value) => `<div class="rule"><span>${label}</span>
    <button class="btn step" type="button" data-limit="${key}" data-dir="-1" aria-label="Lower ${label}">−</button>
    <b class="mono">${value}</b>
    <button class="btn step" type="button" data-limit="${key}" data-dir="1" aria-label="Raise ${label}">+</button></div>`;
  return `<h2>Dispatch rules</h2>
    ${rule("qcMax", "QC queue limit", s.limits.qcMax)}
    ${rule("reserve", "Usage reserve", s.limits.reserve + "%")}
    ${rule("contextRestart", "Restart lane at context", s.limits.contextRestart + "%")}
    <p class="hint">Lower the QC limit or raise the reserve to slow the floor down and keep a buffer.</p>`;
}

function logView(s, board) {
  const rows = s.log.slice(0, 8).map(e =>
    `<li><span class="mono">${clock(e.t)}</span><span>${e.ticket ? `<b class="mono">${board.id(e.ticket)}</b> ` : ""}${esc(e.text)}</span></li>`).join("");
  return `<h2>Flow log</h2><ol>${rows || `<li><span></span><span class="empty">Starting up…</span></li>`}</ol>`;
}

function mapView(s, board) {
  const NW = 104, NH = 42;
  const { pos, height } = layoutMap(W);
  const cp = criticalPath(s);
  const curve = (a, b) => { const y1 = a.y + NH / 2, y2 = b.y - NH / 2, m = (y1 + y2) / 2; return `M${a.x},${y1} C${a.x},${m} ${b.x},${m} ${b.x},${y2}`; };
  const edges = TICKETS.flatMap(t => t.deps.map(d => [d, t.id]));
  const crit = edges.filter(([a, b]) => cp.isEdge(a, b)).map(([a, b]) => `<path class="e e-crit" d="${curve(pos[a], pos[b])}"/>`).join("");
  const plain = edges.map(([a, b]) => `<path class="e ${s.tickets[a].stage === "shipped" ? "e-done" : "e-pend"}" d="${curve(pos[a], pos[b])}"/>`).join("");
  const nodes = TICKETS.map(t => {
    const p = pos[t.id], st = ticketStatus(s, t.id), x = p.x - NW / 2, y = p.y - NH / 2;
    const color = `var(${STATUS[st].color})`;
    const fill = st === "building" ? color : `color-mix(in srgb, ${color} ${st === "locked" ? 0 : 18}%, var(--surface))`;
    return `<g class="n" data-ticket="${t.id}" role="button" tabindex="0" aria-label="${board.id(t.id)} ${esc(t.short)}, ${STATUS[st].label}">
      <rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="9" style="fill:${fill};stroke:${cp.nodes.has(t.id) ? "var(--accent-ink)" : color};stroke-width:${cp.nodes.has(t.id) ? 2.4 : 1.6}${st === "locked" ? ";stroke-dasharray:4 3" : ""}"/>
      <text class="id" x="${x + 9}" y="${y + 17}" ${st === "building" ? 'style="fill:var(--on-accent)"' : ""}>${board.id(t.id)}${st === "shipped" ? " ✓" : ""}</text>
      <text class="t2" x="${x + 9}" y="${y + 33}" ${st === "building" ? 'style="fill:var(--on-accent)"' : ""}>${esc(t.short)}</text></g>`;
  }).join("");
  const legend = ["locked", "ready", "building", "needs-you", "rework", "qc", "shipped"].map(k => `<span><i class="sw" style="--c:var(${STATUS[k].color})"></i>${STATUS[k].label}</span>`).join("");
  return `<div style="display:grid;gap:10px">
    <p class="hint">Read top to bottom: each row waits on the row above. ${cp.length} tickets left on the critical path (yellow).</p>
    <div class="legend">${legend}</div>
    <div class="map-box"><svg viewBox="0 0 ${W} ${height}" role="group" aria-label="Epic dependency map">${crit}${plain}${nodes}</svg></div></div>`;
}

function ticketSheet(s, id, board) {
  const t = TICKET[id], tk = s.tickets[id], st = ticketStatus(s, id);
  const lane = s.lanes.find(l => l.id === tk.lane);
  const current = currentCommit(tk);
  const plan = tk.stage === "intake"
    ? `<p class="empty">The plan is written when a lane picks this ticket up.</p>`
    : `<ol class="plan">${tk.commits.map((c, i) => `<li class="${c.done ? "done" : i === current ? "now" : "todo"}"><span class="mk">${c.done ? "✓" : i === current ? "▸" : "○"}</span><span>${esc(c.msg)}</span></li>`).join("")}</ol>`;
  return `<div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grip"></div>
    <div class="sheet-head"><div><span class="mono" style="color:var(--muted);font-weight:700">${board.id(id)}</span>
      <h2 id="sheet-title">${esc(t.title)}</h2>${chip(st)}</div>
      <button class="btn" type="button" data-close>Close</button></div>
    <dl class="meta">
      <dt>Lane</dt><dd>${tk.lane ? `${lane ? lane.agent : "closed lane"} · <span class="mono">${tk.lane}</span>` : "—"}</dd>
      <dt>Branch</dt><dd class="mono">${tk.lane ? `ticket-${id}-${t.short.toLowerCase().replace(/[^a-z0-9]+/g, "-")}` : "—"}</dd>
      <dt>PR</dt><dd>${tk.pr ? `<span class="mono">#${tk.pr}</span>` : "—"}</dd>
      <dt>QC rounds</dt><dd>${tk.qcRounds}</dd>
    </dl>
    <div><h3>Plan · one line per commit</h3>${plan}</div>
    <div><h3>Waits on</h3>${t.deps.length ? `<div class="tokens">${t.deps.map(d => token(board, s, d)).join("")}</div>` : `<p class="empty">Nothing. It can start right away.</p>`}</div>
    <div><h3>Unblocks</h3>${DEPENDENTS[id].length ? `<div class="tokens">${DEPENDENTS[id].map(d => token(board, s, d)).join("")}</div>` : `<p class="empty">Nothing. It is the end of the line.</p>`}</div>
    <p class="source">Written back to the ${board.source}: status "${STATUS[st].board}", and the commit plan as a checklist on the ticket. Agent state comes from herdr pane ${tk.lane ?? "—"}.</p>
  </div>`;
}

function laneSheet(s, laneId, board) {
  const lane = s.lanes.find(l => l.id === laneId);
  if (!lane) return "";
  const shippedHere = s.shipped.filter(id => s.tickets[id].lane === laneId);
  return `<div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grip"></div>
    <div class="sheet-head"><div><span class="mono" style="color:var(--muted);font-weight:700">herdr pane ${lane.id}</span>
      <h2 id="sheet-title">Lane ${lane.id} · ${lane.agent}</h2>
      <span class="hint">Context ${Math.round(lane.context)}% · restarts at ${s.limits.contextRestart}%</span><br>
      ${lane.status === "blocked" ? chip("needs-you") : lane.ticket ? chip(lane.status === "planning" ? "planning" : "building") : `<span class="chip" style="--c:var(--s-wait)">Idle</span>`}</div>
      <button class="btn" type="button" data-close>Close</button></div>
    ${lane.status === "blocked" ? `<p class="ask">${esc(lane.ask)}</p>` : ""}
    <dl class="meta">
      <dt>On the machine</dt><dd>${lane.ticket ? token(board, s, lane.ticket) : "Nothing"}</dd>
      <dt>Shipped here</dt><dd>${shippedHere.length ? `<div class="tokens">${shippedHere.map(id => token(board, s, id)).join("")}</div>` : "None yet"}</dd>
    </dl>
    <div class="row">
      ${lane.status === "blocked" ? `<button class="btn primary" type="button" data-approve="${lane.id}">Approve</button>` : ""}
      ${lane.status === "idle" ? `<button class="btn" type="button" data-close-lane="${lane.id}">Close this lane</button>` : `<span class="hint">A lane can close once it is idle.</span>`}
    </div>
  </div>`;
}

/* =====================================================================
   SHELL: the only place with timers, mutable UI state and the DOM.
   ===================================================================== */

const SEED = 3, WARM_UP_TICKS = 25;
const ui = { sim: runTicks(initialState(SEED), WARM_UP_TICKS), running: true, speed: 1, tab: "factory", sheet: null, board: "notion" };
const $ = id => document.getElementById(id);
const ICON_PLAY = `<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg>`;
const ICON_PAUSE = `<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>`;
const NS = "http://www.w3.org/2000/svg";

const painted = new Map();
/** Replace an element's markup only when it changed, so taps, scroll and animations survive. */
function paint(el, html) {
  if (!el || painted.get(el) === html) return;
  painted.set(el, html);
  el.innerHTML = html;
}

function mountFactory() {
  $("view").innerHTML = `<div style="display:grid;gap:10px">
    <p class="hint">Each lane is one herdr agent. The dispatcher hands a ready ticket to a free lane only when every gate is green. Lanes split tickets into commits, and QC checks the result. Tap anything.</p>
    <div class="floor"><svg id="floor" viewBox="0 0 ${W} 600" role="group" aria-label="Software factory floor">
      <g id="g-static"></g><g id="g-intake"></g><g id="g-dispatch"></g><g id="g-lanes"></g><g id="g-qc"></g><g id="g-ship"></g><g id="g-hits"></g><g id="g-crates"></g>
    </svg></div>
    <section class="log rules" id="rules"></section>
    <section class="log" id="log"></section></div>`;
  const crates = $("g-crates");
  TICKETS.forEach(t => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "crate");
    g.dataset.ticket = t.id;
    g.innerHTML = `<rect width="${CW}" height="${CH}" rx="4"/><text x="${CW / 2}" y="15" text-anchor="middle">${t.id}</text>`;
    crates.appendChild(g);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => $("floor")?.classList.add("anim")));
}

function renderFactory(s, board) {
  const L = factoryLayout(s.lanes.length);
  const svg = $("floor");
  svg.setAttribute("viewBox", `0 0 ${W} ${L.height}`);
  svg.classList.toggle("paused", !ui.running);
  paint($("g-static"), staticView(L, s.lanes.length));
  paint($("g-intake"), intakeLabelView(s));
  paint($("g-dispatch"), dispatchView(s, board));
  paint($("rules"), rulesView(s));
  paint($("g-lanes"), s.lanes.map((lane, i) => laneView(s, lane, L.laneY[i], board)).join(""));
  paint($("g-qc"), qcView(s, L, board));
  paint($("g-ship"), shipLabelView(s, L));
  paint($("g-hits"), s.lanes.map((lane, i) => `<rect class="hit" data-lane="${lane.id}" x="24" y="${L.laneY[i]}" width="300" height="${LANE_H}" rx="10"/>`).join(""));
  for (const g of $("g-crates").children) {
    const p = cratePosition(s, Number(g.dataset.ticket), L);
    g.style.transform = `translate(${p.x}px, ${p.y}px)`;
    g.style.opacity = p.opacity;
    g.setAttribute("class", `crate c-${p.status}`);
  }
  paint($("log"), logView(s, board));
}

let mountedTab = null;
function render() {
  const s = ui.sim, board = BOARDS[ui.board];
  paint($("boards"), boardsView(ui.board));
  paint($("epic"), epicView(s, board));
  paint($("alerts"), alertsView(s, board));
  paint($("tabs"), tabsView(ui.tab));
  if (mountedTab !== ui.tab) {
    mountedTab = ui.tab;
    painted.clear();
    if (ui.tab === "factory") mountFactory();
    return render();
  }
  if (ui.tab === "factory") renderFactory(s, board);
  else paint($("view"), mapView(s, board));
  const sheet = ui.sheet?.kind === "ticket" ? ticketSheet(s, ui.sheet.id, board) : ui.sheet?.kind === "lane" ? laneSheet(s, ui.sheet.id, board) : "";
  paint($("sheet-root"), sheet);
  const latest = s.log[0];
  paint($("ticker"), latest ? `${latest.ticket ? `<b>${board.id(latest.ticket)}</b> ` : ""}${esc(latest.text)}` : "");
  paint($("play"), ui.running ? ICON_PAUSE : ICON_PLAY);
  $("play").setAttribute("aria-label", ui.running ? "Pause the factory" : "Run the factory");
  $("speed").textContent = `${ui.speed}×`;
  $("add").disabled = s.lanes.length >= MAX_LANES;
  $("clock").textContent = clock(s.t);
}

function update(patch) { Object.assign(ui, patch); render(); }

let timer = null;
function restartTimer() {
  clearInterval(timer);
  timer = setInterval(() => {
    const finished = ui.sim.shipped.length === TICKETS.length;
    if (!ui.running || ui.sheet || finished) return;
    update({ sim: tick(ui.sim) });
  }, 800 / ui.speed);
}

document.addEventListener("click", e => {
  const el = sel => e.target.closest(sel);
  if (el("[data-tab]")) return update({ tab: el("[data-tab]").dataset.tab });
  if (el("[data-board]")) return update({ board: el("[data-board]").dataset.board });
  if (el("[data-approve]")) return update({ sim: approve(ui.sim, el("[data-approve]").dataset.approve), sheet: null });
  if (el("[data-close-lane]")) return update({ sim: closeLane(ui.sim, el("[data-close-lane]").dataset.closeLane), sheet: null });
  if (el("[data-limit]")) return update({ sim: changeLimit(ui.sim, el("[data-limit]").dataset.limit, Number(el("[data-limit]").dataset.dir)) });
  if (el("[data-reset]")) return update({ sim: initialState(SEED), running: true });
  if (el("[data-close]")) return update({ sheet: null });
  if (el("[data-ticket]")) return update({ sheet: { kind: "ticket", id: Number(el("[data-ticket]").dataset.ticket) } });
  if (el("[data-lane]")) return update({ sheet: { kind: "lane", id: el("[data-lane]").dataset.lane } });
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.sheet) update({ sheet: null });
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("g[data-ticket]")) { e.preventDefault(); update({ sheet: { kind: "ticket", id: Number(e.target.dataset.ticket) } }); }
});
$("play").addEventListener("click", () => update({ running: !ui.running }));
$("speed").addEventListener("click", () => { update({ speed: ui.speed === 1 ? 3 : 1 }); restartTimer(); });
$("add").addEventListener("click", () => update({ sim: openLane(ui.sim) }));

render();
restartTimer();
</script>
</body></html>
